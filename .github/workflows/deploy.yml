name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CI: true
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_EMAIL: ${{ secrets.VERCEL_TEAM_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Prepare Vercel git metadata
        shell: bash
        run: |
          echo "VERCEL_GIT_COMMIT_AUTHOR_LOGIN=hi9mi" >> $GITHUB_ENV
          echo "VERCEL_GIT_COMMIT_AUTHOR_NAME=hi9mi" >> $GITHUB_ENV
          echo "VERCEL_GIT_COMMIT_AUTHOR_EMAIL=${VERCEL_TEAM_EMAIL}" >> $GITHUB_ENV
          echo "VERCEL_GIT_REPO_OWNER=${{ github.repository_owner }}" >> $GITHUB_ENV
          echo "VERCEL_GIT_REPO_SLUG=${{ github.event.repository.name }}" >> $GITHUB_ENV
          echo "VERCEL_GIT_COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV
          MSG="${{ github.event.head_commit.message }}"
          if [ -z "$MSG" ]; then MSG="CI deploy from GitHub Actions"; fi
          echo "VERCEL_GIT_COMMIT_MESSAGE=$MSG" >> $GITHUB_ENV

      - name: Vercel whoami (debug)
        run: npx vercel whoami --token $VERCEL_TOKEN

      - name: Vercel pull
        run: npx vercel pull --yes --environment=production --scope hi9mi --token $VERCEL_TOKEN

      - name: Vercel build
        run: npx vercel build --prod --token $VERCEL_TOKEN

      - name: Vercel deploy (prebuilt)
        run: npx vercel deploy --prebuilt --prod --scope hi9mi --token $VERCEL_TOKEN
